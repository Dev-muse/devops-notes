name: Task 1 - CI

on:
  push:
    paths:
      - "08-cicd/projects/task-1/**"
      - ".github/workflows/cicd-task1-ci.yml"
  pull_request:
    paths: "08-cicd/projects/task-1/**"

jobs:
  test: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-cicd/projects/task-1
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: checkout code
      - uses: actions/checkout@v4
      - name: setup python
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependancy-path: 08-cicd/projects/task-1/requirements.txt
      - name: install dependancies
      - run: pip install -r requirements.txt

      - name: Linting
        run: flake8 . --max-line-length=100

      - name: Testing
        run: pytest -v

